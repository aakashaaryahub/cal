name: voxlink
description: Voice chat app
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  flutter_animate: ^4.5.2
  google_fonts: 8.2.1
  permission_handler: 12.0.3
  pinput: 6.0.2
  country_picker: ^2.0.28
  daily_flutter: ^0.41.0
  share_plus: ^13.3.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
# App icon. Sources are drawn by tool/make_icon.py; regenerate with
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  # The foreground images already leave room for the launcher mask.
  adaptive_icon_foreground_inset: 0
